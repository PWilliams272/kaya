<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaya Data Analyzer</title>
    <meta name="kaya-viewer-data-mode" content="static" />
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/app.css?v=6" />
    <link rel="stylesheet" href="/static/research.css?v=33" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="main-shell">
        <header class="topbar">
          <div>
            <div class="eyebrow">Exploration</div>
            <h1>Kaya Data Analyzer</h1>
          </div>
          <div class="topbar-actions">
            <div class="status-pill info-pill">Local Only</div>
            <button id="theme-toggle" class="theme-toggle-button" type="button" aria-label="Toggle theme"></button>
          </div>
        </header>

        <div class="tab-bar">
          <button class="tab-button active" type="button" data-tab="gym-comparison">Gym Comparison</button>
          <button class="tab-button" type="button" data-tab="body-morphology">Height and Wingspan</button>
          <button class="tab-button" type="button" data-tab="user-segmentation">User Analysis</button>
          <button class="tab-button" type="button" data-tab="data-overview">Data Overview</button>
          <button class="tab-button" type="button" data-tab="grading-model">Grading Model</button>
          <button class="tab-button" type="button" data-tab="grading-v2">Grading Model v2</button>
        </div>

        {% include 'tabs/gym-comparison.html' %}
        {% include 'tabs/body-morphology.html' %}
        {% include 'tabs/user-segmentation.html' %}
        {% include 'tabs/data-overview.html' %}
        {% include 'tabs/grading-model.html' %}        {% include 'tabs/grading-v2.html' %}      </main>
    </div>
    <script src="/static/app.js?v=92"></script>
  </body>
</html>
